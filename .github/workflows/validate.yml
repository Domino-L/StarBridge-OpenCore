name: Validate Open Core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Scan tracked files
        shell: pwsh
        run: |
          & "./scripts/Test Repository Safety.ps1"

      - name: Validate public downloads and help links
        shell: pwsh
        run: |
          & "./scripts/Test StarBridge Public Hub.ps1"

      - name: Restore
        run: dotnet restore StarBridge.sln

      - name: Build
        run: dotnet build StarBridge.sln --configuration Release --no-restore -p:StarBridgeIncludeCommercialAppearances=false -p:StarBridgeIncludeThirdPartyMedia=false

      - name: Run regression tests
        run: dotnet run --project StarBridge.Core.Tests/StarBridge.Core.Tests.csproj --configuration Release --no-build
