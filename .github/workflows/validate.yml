name: Validate Open Core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Set up pinned Flutter SDK
        shell: pwsh
        run: |
          $sdkPath = Join-Path $env:RUNNER_TEMP 'starbridge-flutter-sdk'
          git init $sdkPath
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK checkout initialization failed' }
          git -C $sdkPath remote add origin https://github.com/flutter/flutter.git
          # Flutter derives its semantic version from the official Git tag.
          # Verify the tag against the fixed commit before executing SDK code.
          git -C $sdkPath fetch --depth 1 origin refs/tags/3.47.2:refs/tags/3.47.2
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Flutter revision fetch failed' }
          git -C $sdkPath checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Flutter checkout failed' }
          if ((git -C $sdkPath rev-parse HEAD) -ne 'd3b14c876900e553bc736ca19295fc09e3853e8e') { throw 'Unexpected Flutter revision' }
          if ((git -C $sdkPath describe --tags --exact-match HEAD) -ne '3.47.2') { throw 'Flutter semantic version tag is missing' }
          (Join-Path $sdkPath 'bin') >> $env:GITHUB_PATH

      - name: Select installed Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Platforms/UAP'
          $sdk = Get-ChildItem -LiteralPath $sdkRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' -and (Test-Path -LiteralPath (Join-Path $_.FullName 'Platform.xml')) } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $sdk) { throw "No complete Windows UAP SDK was found" }
          "STARBRIDGE_TARGET_PLATFORM_VERSION=$($sdk.Name)" >> $env:GITHUB_ENV

      - name: Scan tracked files
        shell: pwsh
        run: |
          & "./scripts/Test Repository Safety.ps1"

      - name: Build and validate the complete public client
        shell: pwsh
        run: |
          & "./scripts/Test StarBridge Public Client.ps1"
