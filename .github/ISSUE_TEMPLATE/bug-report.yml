name: 问题反馈
description: 反馈可以稳定复现的错误、崩溃或异常行为
title: "[问题] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传完整 Game.log、邮箱、账号标识、访问令牌或其他个人数据。
  - type: input
    id: version
    attributes:
      label: 星海舰桥版本
      placeholder: 例如 0.6.5
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 出现了什么问题
      description: 请说明所在页面、预期结果和实际结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 补充信息
      description: 可粘贴已经去除个人信息的诊断摘要，或拖入不含敏感信息的截图。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有提交完整 Game.log、账号信息、令牌或其他个人数据。
          required: true
